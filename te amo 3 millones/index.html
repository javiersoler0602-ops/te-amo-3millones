<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Amo en 3D - Corazones Blancos</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Arial', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">🤍 Te Amo 🤍</div>

    <!-- Importar Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Configuración de la escena, cámara y renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controles de cámara con el mouse
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Definir la forma geométrica del corazón
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 5, y + 5);
        heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
        heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
        heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
        heartShape.bezierCurveTo(x + 13, y + 15.4, x + 16, y + 11, x + 16, y + 7);
        heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
        heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

        const extrudeSettings = {
            depth: 4,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 2,
            bevelSize: 2,
            bevelThickness: 2
        };

        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center(); // Centrar el corazón en su origen

        // Material BLANCO para el corazón principal
        const whiteMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffffff, 
            shininess: 120,
            specular: 0xaaaaaa,
            wireframe: false
        });

        // Corazón principal en el centro
        const mainHeart = new THREE.Mesh(heartGeometry, whiteMaterial);
        mainHeart.scale.set(0.3, 0.3, 0.3);
        scene.add(mainHeart);

        // 3. Crear grupo con múltiples corazones blancos flotantes y textos
        const floatingGroup = new THREE.Group();
        scene.add(floatingGroup);

        // Función para crear sprites con el texto "Te Amo" en blanco
        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 128;
            
            context.font = 'Bold 32px Arial';
            context.fillStyle = '#ffffff';
            context.textAlign = 'center';
            context.shadowColor = 'rgba(255, 255, 255, 0.8)';
            context.shadowBlur = 10;
            context.fillText(message, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(4, 2, 1);
            return sprite;
        }

        // Crear varios corazones blancos pequeños alrededor
        const numObjects = 16;
        for (let i = 0; i < numObjects; i++) {
            const phi = Math.acos(-1 + (2 * i) / numObjects);
            const theta = Math.sqrt(numObjects * Math.PI) * phi;
            const radius = 9;

            const posX = radius * Math.cos(theta) * Math.sin(phi);
            const posY = radius * Math.sin(theta) * Math.sin(phi);
            const posZ = radius * Math.cos(phi);

            // Alternar entre un pequeño corazón blanco y el texto "Te Amo 🤍"
            if (i % 2 === 0) {
                const smallHeart = new THREE.Mesh(heartGeometry, whiteMaterial);
                smallHeart.scale.set(0.08, 0.08, 0.08);
                smallHeart.position.set(posX, posY, posZ);
                smallHeart.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                floatingGroup.add(smallHeart);
            } else {
                const sprite = createTextSprite("Te Amo 🤍");
                sprite.position.set(posX, posY, posZ);
                floatingGroup.add(sprite);
            }
        }

        // 4. Luces para destacar el color blanco y sombras 3D
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1.2);
        pointLight1.position.set(15, 15, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x888888, 0.8);
        pointLight2.position.set(-15, -15, -15);
        scene.add(pointLight2);

        camera.position.z = 16;

        // 5. Animación de rotación continua en múltiples ejes
        function animate() {
            requestAnimationFrame(animate);

            // Rotar el corazón central a todos lados
            mainHeart.rotation.x += 0.01;
            mainHeart.rotation.y += 0.015;
            mainHeart.rotation.z += 0.008;

            // Rotar todo el grupo flotante en sentido opuesto
            floatingGroup.rotation.y -= 0.006;
            floatingGroup.rotation.x += 0.004;
            floatingGroup.rotation.z -= 0.002;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de ventana redimensionable
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
